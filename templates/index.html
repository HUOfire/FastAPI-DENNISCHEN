<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>Fastapi-后台管理</title>
     <!-- 引入icon -->
    <link rel="shortcut icon" href="../static/image/favicon.png">
    <link rel="stylesheet" href="../static/css/bootstrap.css">
    <script src="../static/js/jquery-3.5.1.min.js"></script>
    <script src="../static/js/bootstrap.min.js"></script>
    <script src="../static/js/index.js"></script>

</head>
<body>
    <!-- 导航栏start -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <!-- 导航栏logo start -->
        <img src="../static/image/logo.png" alt="logo" width="139" height="50" class="d-inline-block align-top">
        <!-- 导航栏logo end -->
        <a class="navbar-brand" href="/index">Fastapi</a>
        <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav">
                <li class="nav-item active">
                    <a class="nav-link" href="/index">首页 <span class="sr-only">(current)</span></a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="/apilog/logs">日志管理</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="/docs_iframe">接口文档</a>
                </li>
            </ul>
            <!-- 右侧登录信息 start -->
            <ul class="navbar-nav ml-auto">
                <li class="nav-item dropdown">
                    <a class="nav-link dropdown-toggle" Href="#" id="navbarDropdownMenuLink" role="button" data-toggle="dropdown" aria-haspopup="true" aria-expanded="false">
                        <img src="../static/image/tx.jpg" class="navbar-avatar" alt="用户头像">
                        <span class="ml-2">用户名</span>
                    </a>
                    <div class="dropdown-menu" aria-labelledby="navbarDropdownMenuLink">
                        <a class="dropdown-item" href="#">修改密码</a>
                        <!-- 退出后禁止回退 -->
                        <a class="dropdown-item" onclick="logout()" >退出</a>
                    </div>
                </li>
            </ul>
            <!-- 右侧登录信息 end -->
        </div>
    </nav>
    <!-- 导航栏end -->
    <!-- 主体内容start -->
    <H1 class="text-center">Bootstrap 4 with FastAPI</H1>
    <div class="container mt-4">
        <h1 class="display-4 text-center"></h1>
    </div>
    <div id="date-message" hidden>{{user.expire_datetime}}</div>
    <!-- 模态框 -->
    <div class="modal fade" id="loginModal" tabindex="-1" role="dialog" aria-labelledby="loginModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered" role="document">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="loginModalLabel">需要登录</h5>
                    <!-- 移除了右上角的关闭按钮 (data-dismiss="modal")，确保用户只能点击确定 -->
                </div>
                <div class="modal-body text-center py-4">
                    <div class="mb-3">
                        <svg width="64" height="64" viewBox="0 0 16 16" fill="#007bff" xmlns="http://www.w3.org/2000/svg">
                            <path fill-rule="evenodd" d="M8 1a2 2 0 0 1 2 2v4H6V3a2 2 0 0 1 2-2zm3 6V3a3 3 0 0 0-6 0v4a2 2 0 0 0-2 2v5a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2z"/>
                        </svg>
                    </div>
                    <h5>会话已过期或未登录</h5>
                    <p class="text-muted">为了保障您的账户安全，执行此操作前请先登录。</p>
                </div>
                <div class="modal-footer justify-content-center border-top-0 pb-4">
                    <!-- 关键：移除 data-dismiss="modal"，完全由 JS 控制关闭和跳转 -->
                    <button type="button" class="btn btn-confirm btn-primary" id="confirmLoginBtn">
                        前往登录
                    </button>
                </div>
            </div>
        </div>
    </div>

</body>
</html>
